name: Backend CI/CD

# Build + validate on every push/PR; deploy to the VPS only on push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  # ── 1. Continuous Integration: install, generate client, typecheck, build ──
  ci:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (tsc + tsc-alias)
        run: npm run build

  # ── 2. Continuous Deployment: SSH to the server, update, migrate, restart ──
  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -1)/bin:$PATH" 2>/dev/null || true
            cd ~/brainwave/erp_backend

            echo "▸ Pulling latest main"
            git fetch --all --prune
            git reset --hard origin/main

            echo "▸ Installing dependencies"
            npm ci

            echo "▸ Applying database migrations"
            npx prisma migrate deploy
            npx prisma generate

            echo "▸ Building"
            npm run build

            echo "▸ Restarting app (PM2)"
            pm2 reload erp-backend --update-env || pm2 start dist/server.js --name erp-backend
            pm2 save

            echo "▸ Health check"
            sleep 3
            curl -fsS http://localhost:4000/health || (echo "Health check failed" && pm2 logs erp-backend --lines 30 --nostream && exit 1)
